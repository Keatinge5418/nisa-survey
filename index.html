<title>NISA Nephrops Trawl Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow working column, a sticky progress strip, sections as numbered chart panels */
:root{
  --bg:#eef2f4; --panel:#ffffff; --ink:#14232c; --muted:#556670; --line:#cfd9de;
  --sea:#0b4f6c; --head:#0b4f6c; --sea-soft:#dcebf1; --buoy:#d9531e; --buoy-ink:#ffffff; --ok:#2e7d4f;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171c; --panel:#15232a; --ink:#e3ecef; --muted:#93a6ae; --line:#2b3d46;
  --sea:#6cb8d6; --head:#123a4d; --sea-soft:#1b3440; --buoy:#f07a45; --buoy-ink:#1a0d06; --ok:#6cc08f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171c; --panel:#15232a; --ink:#e3ecef; --muted:#93a6ae; --line:#2b3d46;
  --sea:#6cb8d6; --head:#123a4d; --sea-soft:#1b3440; --buoy:#f07a45; --buoy-ink:#1a0d06; --ok:#6cc08f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{background:var(--head);color:#fff;padding-block:28px 22px}
header.top .wrap{padding-block:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.1;margin:.25em 0 .2em;text-wrap:balance}
header.top p{margin:0;max-width:60ch;opacity:.92}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:8px;padding-block:8px}
.bar .row{display:flex;gap:10px;align-items:center;min-width:0}
.jumpwrap{flex:1;min-width:0}
.bar .jump{margin-top:0;flex-wrap:nowrap}
.bar .jump label{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink)}
.bar .jump select{border:2px solid var(--buoy);background:var(--sea-soft);color:var(--ink);font-weight:600;font-size:16px;padding:10px 12px;box-shadow:0 0 0 3px color-mix(in srgb,var(--buoy) 22%,transparent)}
.bar .jump select:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.meter{flex:1;height:8px;background:var(--sea-soft);border-radius:4px;overflow:hidden;min-width:0}
.meter span{display:block;height:100%;background:var(--sea);width:0;transition:width .3s}
.bar small{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.bar .home{flex:none;padding:8px 10px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);cursor:pointer}
section.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:20px}
section.sec>summary,section.sec>.head{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:baseline}
section.sec summary::-webkit-details-marker{display:none}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.secno{font-family:var(--mono);color:var(--sea);font-size:13px;flex:none}
.sectitle{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25}
.secbody{padding:0 18px 18px;display:grid;gap:18px}
.note{color:var(--muted);font-size:14.5px;max-width:65ch;margin:0}
.q{display:grid;gap:8px}
.q label.lab, .q .lab{font-weight:500}
.q .lab b{font-family:var(--mono);color:var(--sea);font-weight:500;margin-right:6px}
input[type=text],input[type=number],input[type=email],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.chip input:focus-visible+span{outline:3px solid var(--buoy);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px;user-select:none}
.chip input:checked+span{background:var(--sea);border-color:var(--sea);color:#fff}
:root[data-theme="dark"] .chip input:checked+span{color:#0d171c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip input:checked+span{color:#0d171c}}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pair label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.scale{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
.scale table{border-collapse:collapse;width:100%;font-size:14px}
.scale td,.scale th{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scale th{font-family:var(--mono);font-weight:500;color:var(--sea);font-size:12.5px}
.items{display:grid;gap:10px}
.group{font-family:var(--display);font-weight:700;font-size:15.5px;color:var(--sea);margin-top:6px}
.item{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:8px;background:var(--bg)}
.item .t{font-size:15px}
.item .t b{font-family:var(--mono);font-weight:500;color:var(--sea);margin-right:6px}
.item .row{display:grid;grid-template-columns:1fr;gap:8px}
.item .row.two{grid-template-columns:1fr}
.q select,.pair select{width:100%;min-width:0;padding:9px 10px;font-family:var(--body);font-size:15px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px}
[hidden]{display:none!important}
.reg{margin-top:10px;border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:4px;padding:10px 12px;background:var(--bg)}
.reg .regh{font-family:var(--mono);font-size:12.5px;color:var(--sea);margin-bottom:6px}
.reg dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:14px}
.reg dt{color:var(--muted)}
.reg dd{margin:0;min-width:0;overflow-wrap:anywhere}
.reg .regn{font-size:12.5px;color:var(--muted);margin-top:8px}
.sub{display:grid;gap:6px;margin-top:8px;font-size:14px;color:var(--muted)}
.item select{padding:9px 10px;background:var(--panel);width:100%;min-width:0;font-family:var(--body);font-size:15px;letter-spacing:0}
.item label{display:grid;gap:6px}
.item .qq{font-size:14.5px;color:var(--ink);line-height:1.35}
.guide{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.item .row{gap:14px!important}
.callout{border-left:4px solid var(--buoy);background:var(--sea-soft);padding:12px 14px;border-radius:0 4px 4px 0;font-size:15px}
.send{margin-top:24px;background:var(--panel);border:2px solid var(--sea);border-radius:6px;padding:18px;display:grid;gap:14px}
.send h2{font-family:var(--display);font-size:22px;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button:disabled{opacity:.4;cursor:not-allowed}
button.x{padding:4px 10px;font-size:13px;margin-left:6px}
button{font:inherit;font-weight:600;border-radius:4px;padding:11px 16px;border:1px solid var(--sea);background:var(--panel);color:var(--sea);cursor:pointer}
button.primary{background:var(--buoy);border-color:var(--buoy);color:var(--buoy-ink)}
.rcpts{display:grid;gap:8px}
.rcpt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--bg)}
.rcpt input{width:20px;height:20px;margin-top:2px;flex:none}
.rcpt .addr{border:0;padding:0;background:none;font-size:13px}
.addr{font-family:var(--mono);font-size:14px;user-select:all;word-break:break-all;background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:4px}
.status{font-size:14.5px;color:var(--ok);min-height:1.4em}
.status.err{color:var(--buoy)}
pre.out{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;max-height:240px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;margin:0}
.saved{font-family:var(--mono);font-size:12px;color:var(--muted)}

section.sec{padding-bottom:4px}
.step[hidden]{display:none!important}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:0 18px 18px}
.nav .pos{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.jump{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.jump select{flex:1;min-width:0;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="eyebrow">IS&amp;EFPO · IFPO · Seaview Marine · <span id="verHead">Form V1.9, 18 October 2026</span></div>
  <h1>North Irish Sea Array: Nephrops Trawl Consultation</h1>
  <p>One form per vessel, in short pages. Fill in what applies to you and skip the rest; press <strong>Next</strong> to move on. Your answers are kept on this phone as you go.</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="row"><div id="jumpWrap" class="jumpwrap"></div></div>
  <div class="row"><div class="meter" aria-hidden="true"><span id="meter"></span></div><small id="count">0 answered</small><small class="ver" id="verBar">V1.9</small><button type="button" class="home" id="themeBtn">Light mode</button></div>
</div></div>

<main class="wrap" id="form"></main>

<script>
/* ---------- settings: the three addresses the answers go to ---------- */
const RECIPIENTS = [
  {name:"John Lynch, IS&EFPO", email:"isefpo@gmail.com"},
  {name:"Aodh O'Donnell, IFPO", email:"aodh.odonnell@ifpo.ie"}
];
/* a copy always goes to the assessor, as a blind copy; not shown in the list */
const ASSESSOR="Michael@Mkeatinge.onmicrosoft.com";
const FORM_VERSION = "V1.9 online";
const FORM_DATE = "18 October 2026";
/* light / dark switch, remembered on this phone */
(function(){const R=document.documentElement,K="nisa-theme";
  const isDark=()=>R.dataset.theme?R.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const lab=()=>{const b=document.getElementById("themeBtn");if(b)b.textContent=isDark()?"Light mode":"Dark mode"};
  try{const t=localStorage.getItem(K);if(t)R.dataset.theme=t}catch(e){}
  lab();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",lab);
  document.getElementById("themeBtn").addEventListener("click",()=>{const t=isDark()?"light":"dark";R.dataset.theme=t;try{localStorage.setItem(K,t)}catch(e){}lab()});
})();
{const v=FORM_VERSION.split(" ")[0];document.getElementById("verHead").textContent="Form "+v+", "+FORM_DATE;document.getElementById("verBar").textContent=v;}

/* ---------- form definition (mirrors Consultation Instrument V1.1) ---------- */
const MONTHS=["J","F","M","A","M","J","J","A","S","O","N","D"];
const MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SEV=["1 Hardly at all","2 A cost, but I manage","3 Cuts earnings or how I work","4 Puts the season at risk","5 Could force me out","6 Does not apply to me"];
const REC=["R1 Within the trip or week","R2 Within the season","R3 The following season","R4 Not before the next works","R5 Still not back to normal"];
const LIK=["1 Very unlikely","2 Unlikely","3 Could go either way","4 Likely","5 Almost certain","6 Does not apply to me"];
const CON=["1 Not at all","2 A nuisance only","3 Cuts earnings or how I fish","4 Puts my finances at risk","5 Could force me out","6 Does not apply to me"];

const SECTIONS=[
{id:"intro",no:"",title:"About this form",open:true,html:`
<p class="note">The Irish South and East Fish Producers Organisation (IS&amp;EFPO) and the Irish Fish Producers Organisation (IFPO) are carrying out an independent socio-economic assessment of what the North Irish Sea Array (NISA) wind farm means for the Nephrops trawl fleet working out of Howth and Clogherhead. It is chaired by John Lynch (IS&amp;EFPO) and Aodh O'Donnell (IFPO). The analysis is by Seaview Marine, which is independent of the developer.</p>
<p class="note">Official landings and VMS records show the fleet as a whole. They do not show what one vessel would lose, what it could make up elsewhere, or how the loss reaches the crew and their households. That is what this form is for.</p>
<div class="callout"><strong>Your answers.</strong> They are held jointly by the IS&amp;EFPO and the IFPO and are not passed to the developer. Results are reported only in aggregate, and no vessel can be identified. Completing the form is not a condition of any disturbance payment or SFC support. You may withdraw up to the delivery of the report. Section 8 gives the full data protection statement.</div>
<p class="note">Nothing is sent until you press <strong>Send answers</strong>. Your answers are kept on this device as you go, so you can close the page and come back to it.</p>`},

{id:"s1",no:"1",title:"Vessel and respondent",fields:[
 {k:"vessel",t:"vessel",q:"Your vessel"},
 {"k": "loa", "t": "pair", "q": "Length overall, engine power and fleet segment", "parts": [{"l": "Length overall", "o": ["Under 15 m", "15 to 17.9 m", "18 to 19.9 m", "20 to 21.9 m", "22 to 23.9 m", "24 m or over"]}, {"l": "Engine power", "o": ["Under 300 kW", "300 to 449 kW", "450 to 599 kW", "600 to 749 kW", "750 kW or over"]}, {"l": "Fleet segment", "o": ["Polyvalent, 18 m and over", "Polyvalent, under 18 m", "Beam trawl", "Specific (scallop)", "RSW pelagic", "Other", "Don't know"]}]},
 {k:"rig",t:"choice",q:"Rig",opts:["Single","Twin","Quad"]},
 {"k": "doors", "t": "pair", "q": "Door spread and sweep length", "parts": [{"l": "Door spread", "o": ["Under 60 m", "60 to 79 m", "80 to 99 m", "100 to 119 m", "120 m or more", "Don't know"]}, {"l": "Sweep length", "o": ["Under 50 m", "50 to 99 m", "100 to 149 m", "150 to 199 m", "200 m or more", "Don't know"]}]},
 {"k": "species", "t": "multi", "q": "Target species besides Nephrops (choose any)", "opts": ["Haddock", "Whiting", "Monkfish", "Cod", "Plaice", "Sole", "Ray", "Other", "Nephrops only"]},
 {k:"where",t:"multi",q:"Where the vessel tows",opts:["Inside the array area","Along the cable corridor","On the ground next to them"]},
 {"k": "tow", "t": "pair", "q": "Usual tow length, and tow direction where you cross the array", "parts": [{"l": "Tow length", "o": ["Under 2 hours", "2 to 3 hours", "3 to 4 hours", "4 to 5 hours", "5 to 6 hours", "Over 6 hours"]}, {"l": "Direction", "o": ["NNW–SSE", "N–S", "NE–SW", "E–W", "Varies with the tide", "I do not cross the array"]}]},
 {"k": "trip", "t": "sel", "q": "Usual trip length (days at sea)", "opts": ["Day trips", "2 days", "3 days", "4 to 5 days", "6 to 7 days", "More than a week"]},
 {k:"landport",t:"multi",q:"Usual landing port or ports",opts:["Howth","Clogherhead","Other"]},
 {"k": "homeport", "t": "sel", "q": "Home port", "opts": ["Clogherhead", "Howth", "Skerries", "Rush", "Balbriggan", "Drogheda", "Dún Laoghaire", "Other"]},
 {"k": "crew", "t": "sel", "q": "Number of crew, including the skipper", "opts": ["1", "2", "3", "4", "5", "6", "7", "8 or more"]},
 {"k": "years", "t": "sel", "q": "Years you have fished this ground", "opts": ["Under 5", "5 to 9", "10 to 19", "20 to 29", "30 or more"]},
 {"k": "resp", "t": "pair", "q": "Your name and role", "parts": ["Name", {"l": "Role", "o": ["Owner", "Skipper", "Owner and skipper", "Other"]}]},
 {k:"contact",t:"text",q:"Contact number or email"},
 {"k": "po", "t": "sel", "q": "Producer organisation membership", "opts": ["IS&EFPO", "IFPO", "KFO", "IS&WFPO", "None", "Other"]}
]},

{id:"s2a",no:"2a",title:"The value at stake",note:"These answers are the most important part of the form. They show what is at stake on the ground affected.",fields:[
 {k:"q1a",n:1,t:"choice",q:"Do you tow, or have you towed, inside the array area?",opts:["Yes","No","Occasionally"]},
 {k:"q1b",t:"choice",q:"…and along the export cable corridor?",opts:["Yes","No","Occasionally"]},
 {k:"q2",n:2,t:"choice",q:"Typical gross landings in a year, by value, before costs",opts:["Under €400k","€400–700k","€700k–1M","€1–1.5M","Over €1.5M"]},
 {k:"q2x",t:"text",q:"Exact figure, if you are willing (€)"},
 {"k": "q3", "n": 3, "t": "sel", "q": "Roughly what share of the year's gross earnings comes from inside the array area?", "opts": ["None (0%)", "1 to 10%", "11 to 25%", "26 to 50%", "51 to 75%", "76 to 99%", "All (100%)", "Don't know"]},
 {k:"q4",n:4,t:"months",q:"In which months do you tow there?"},
 {k:"q4p",t:"months",q:"Which are the peak months?"},
 {"k": "q5", "n": 5, "t": "pair", "q": "Gross landings by value in a typical peak month, and in a typical month outside the peak", "parts": [{"l": "Peak month", "o": ["Under €10,000", "€10,000 to €24,999", "€25,000 to €49,999", "€50,000 to €74,999", "€75,000 to €99,999", "€100,000 to €149,999", "€150,000 or more", "Don't know"]}, {"l": "Other month", "o": ["Under €10,000", "€10,000 to €24,999", "€25,000 to €49,999", "€50,000 to €74,999", "€75,000 to €99,999", "€100,000 to €149,999", "€150,000 or more", "Don't know"]}]},
 {"k": "q6", "n": 6, "t": "pair", "q": "What share of those landings comes from inside the array area?", "parts": [{"l": "Peak month", "o": ["None (0%)", "1 to 10%", "11 to 25%", "26 to 50%", "51 to 75%", "76 to 99%", "All (100%)", "Don't know"]}, {"l": "Other month", "o": ["None (0%)", "1 to 10%", "11 to 25%", "26 to 50%", "51 to 75%", "76 to 99%", "All (100%)", "Don't know"]}]},
 {"k": "q7", "n": 7, "t": "pair", "q": "What do you take inside the array area, as a share of its value?", "parts": [{"l": "Nephrops", "o": ["None (0%)", "1 to 10%", "11 to 25%", "26 to 50%", "51 to 75%", "76 to 99%", "All (100%)", "Don't know"]}, {"l": "Haddock", "o": ["None (0%)", "1 to 10%", "11 to 25%", "26 to 50%", "51 to 75%", "76 to 99%", "All (100%)", "Don't know"]}, {"l": "Monkfish", "o": ["None (0%)", "1 to 10%", "11 to 25%", "26 to 50%", "51 to 75%", "76 to 99%", "All (100%)", "Don't know"]}, {"l": "Whiting", "o": ["None (0%)", "1 to 10%", "11 to 25%", "26 to 50%", "51 to 75%", "76 to 99%", "All (100%)", "Don't know"]}, {"l": "Other", "o": ["None (0%)", "1 to 10%", "11 to 25%", "26 to 50%", "51 to 75%", "76 to 99%", "All (100%)", "Don't know"]}]},
 {k:"q8",n:8,t:"choicetext",q:"Are there days of tide or weather when the array ground is the best or only ground you can work? Describe.",opts:["Yes","No"]},
 {k:"q9",n:9,t:"choice",q:"During construction the works move around the array, with 500 m safety zones around structures and vessels. Could you keep towing the parts not being worked?",opts:["Yes","Partly","No"]},
 {k:"q10",n:10,t:"choice",q:"Once the turbines are in, would you tow inside the array at all, and on which rig?",opts:["Yes","Single rig only","No"]},
 {k:"q11a",n:11,t:"choice",q:"Do you hold chart plotter tracks or other records of where you tow?",opts:["Yes","No"]},
 {k:"q11b",t:"choice",q:"Would you provide a plotter download to the IS&EFPO or the IFPO?",opts:["Yes","No"]}
]},

{id:"s2b",no:"2b",title:"What you could make up",note:"For vessels that tow inside the array area or along the cable corridor.",fields:[
 {"k": "q12", "n": 12, "t": "multi", "q": "If you could not tow the array ground, where would you go? (choose any)", "opts": ["Other parts of 36E4", "36E3", "37E4", "Elsewhere in the Irish Sea", "Outside the Irish Sea", "Nowhere suitable"]},
 {"k": "q13", "n": 13, "t": "sel", "q": "How far is that ground? (steaming each way)", "opts": ["Under 1 hour", "1 to 2 hours", "2 to 3 hours", "3 to 4 hours", "4 to 6 hours", "Over 6 hours"]},
 {"k": "q14", "n": 14, "t": "choicesel", "q": "Would it give the same catch per hour towed?", "opts": ["Better", "Same", "Worse"], "dl": "By roughly how much?", "dopts": ["Under 10%", "10 to 24%", "25 to 49%", "50% or more", "Don't know"]},

{id:"s8",no:"8",title:"Consent and data protection",note:"",html:`
<p class="note"><strong>Data controller.</strong> The IS&amp;EFPO and the IFPO are joint data controllers for this form and anything obtained under the consents below. <strong>Legal basis.</strong> Your consent. You may withdraw it at any time up to the delivery of the report, and everything held about you and your vessel is then deleted. <strong>Retention.</strong> Identifying material is deleted six weeks after the report is delivered to the two Organisations, or six months from the date of this form, whichever is first. <strong>Who sees it.</strong> The IS&amp;EFPO and the IFPO hold it. The assessor, Michael Keatinge, sees it only on the Organisations' instructions and for this assessment. Nothing is passed to the developer or any other party. <strong>Your rights.</strong> You may ask to see, correct or delete what is held, and you may complain to the Data Protection Commission at www.dataprotection.ie.</p>
<p class="note">The Sea-Fisheries Protection Authority releases vessel-level sales notes, logbooks and VMS data only with the owner's written consent. VMS is the main record of where these vessels tow, so that consent matters most. Anything obtained is reported only in aggregate.</p>
<p class="note"><strong>Security code.</strong> Choose a word and a number below and write them down or remember them. Before your answers are used, your Producer Organisation will phone you on the number it holds for your vessel and ask you to confirm this code, so that nobody can send a form in your vessel's name. Do not use a PIN or password you use for anything else.</p>`,fields:[
 {k:"con_sales",t:"choice",q:"I consent to the IS&EFPO and the IFPO obtaining my sales note records for the reference period.",opts:["Yes","No"]},

{id:"s9",no:"9",title:"Closing questions",html:`<div class="callout"><strong>Note on the scope of this survey.</strong> This survey has been prepared as a stakeholder input to a submission on the proposed North Irish Sea Array (NISA), following An Coimisiún Pleanála's request for further information.<br><br>The completed survey is a useful exercise, but of necessity the questionnaire is limited in scope. It cannot capture in full the potential loss of income and the disruption to fishing activity, both inside and outside the Maritime Area Consent (MAC) area, including the effects on tow lines, tow geometry and transit, and the anticipated loss of access to fishing grounds.<br><br>These considerations are a key concern for this long-established, traditional fishery, and are likely to affect the commercial viability of mobile towed-gear fishing in the north Irish Sea. The planning process requires a further, comprehensive assessment of all impacts outside the MAC area on this fishing métier, at fleet and individual vessel level.</div>`,fields:[
 {k:"close1",t:"textarea",q:"What would make the difference to you during construction, or once the wind farm is running? Anything at all, whether or not it has been offered."},
 {k:"close2",t:"textarea",q:"Is there anything this form has not asked about that matters to your operation?"}
]}

/* ---------- state ---------- */
const KEY="nisa-nephrops-form-v11";
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));document.getElementById("savedAt").textContent="Saved on this device "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}catch(e){} progress()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- render ---------- */
const root=document.getElementById("form");
function fieldHTML(f){
  const id="f_"+f.k, lab=`<div class="lab">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</div>`;
  if(f.t==="text") return `<div class="q"><label class="lab" for="${id}">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</label><input type="text" id="${id}" data-k="${f.k}"></div>`;
  if(f.t==="textarea") return `<div class="q"><label class="lab" for="${id}">${f.n?`<b>Q${f.n}</b>`:""}${esc(f.q)}</label><textarea id="${id}" data-k="${f.k}"></textarea></div>`;
  if(f.t==="choice"||f.t==="multi"){const type=f.t==="multi"?"checkbox":"radio";

re crowded and fished harder?", "C.7": "How likely is it that you will have to steam around the array instead of through it?", "C.8": "How likely is it that major maintenance or repairs will shut you out of the array?", "C.9": "How likely is it that the wind farm will harm the Nephrops, or the mud they live in?", "C.10": "How likely is it that wind farm traffic will get in the way of your fishing?", "C.11": "How likely is it that your insurer will refuse cover, or charge more, for towing inside the array?", "C.12": "How likely is it that more wind farms will follow on your grounds in the Irish Sea?", "C.13": "How likely is it that compensation and SFC support will fall short, or not last as long as the effects?", "C.14": "How likely is it that guard and standby vessel work will go to boats from outside the region?", "C.15": "How likely is it that material left at decommissioning will stop you fishing that ground again?", "C.16": "How likely is it that the wind farm will affect whether someone takes over your vessel or the fishery?", "C.17": "How likely is it that the wind farm has already changed, or will change, a decision about your business?"};
const IMPACTS=[["I.1","Reduced days at sea"],["I.2","Reduced access to grounds"],["I.3","Increased steaming time"],["I.4","Reduced landing volume"],["I.5","Reduced catch rate on the alternative ground"],["I.6","Reduced catch quality"],["I.7","Reduced price per kilogram"],["I.8","Loss of market or buyer continuity"],["I.9","Increased fuel cost"],["I.10","Gear loss, damage or replacement"],["I.11","Increased gear wear, repair and net replacement"],["I.12","Insurance, safety and compliance cost"],["I.13","Deferred maintenance"],["I.14","Deferred investment or vessel replacement"],["I.15","Reduced crew earnings"],["I.16","Crew leaving the vessel"],["I.17","Difficulty rehiring"],["I.18","Skipper or owner time lost to engagement and administration"]];
function top3HTML(){const R=SEV;
  const grp=(title,list)=>`<optgroup label="${esc(title)}">${list.map(([c,t])=>`<option value="${c}">${c} ${esc(t)}</option>`).join("")}</optgroup>`;
  const sec=id=>SECTIONS.find(x=>x.id===id);
  const opts=grp("Section 3: Pre-construction and construction",sec("s3").items.flatMap(g=>g[1]))+grp("Section 4: Repeated and overlapping works",sec("s4").items.flatMap(g=>g[1]))+grp("Section 6: The wind farm in operation",sec("s6").lc);
  let h=`<div class="items">${["First","Second","Third"].map((x,i)=>`<label class="q" for="t3_${i}"><span class="lab">${x} most important item</span><select id="t3_${i}" data-k="top3__${i}"><option value="">Choose an item</option>${opts}</select></label>`).join("")}</div>`;
  h+=`<div class="items">`+IMPACTS.map(([c,t])=>{const b="i_"+c.replace(".","_");return `<div class="item"><div class="t"><b>${c}</b>${esc(t)}</div><div class="row">${["First","Second","Third"].map((x,i)=>`<label for="${b}_${i}"><span class="qq">${x} item: how badly?</span>${selHTML(b+"_"+i,c+"__"+i,R,"Choose an answer")}</label>`).join("")}</div></div>`}).join("")+`</div>`;
  return h}
function render(){
  let h="";
  for(const s of SECTIONS){
    const idx=SECTIONS.indexOf(s);
    h+=`<section class="sec step" id="${s.id}" data-step="${idx}" hidden><div class="head"><span class="secno">${s.lab||(s.no?("Section "+s.no):"Start")}</span><span class="sectitle">${esc(s.title)}</span></div><div class="secbody">`;
    if(s.html) h+=s.html;
    if(s.note) h+=`<p class="note">${esc(s.note)}</p>`;
    if(s.ratingNote) h+=SCALES;
    if(s.items) for(const [g,list] of s.items){h+=`<div class="group">${esc(g)}</div><div class="items">${list.map(([c,t])=>ratingItem(c,t)).join("")}</div>`}
    if(s.lc) h+=LCSCALE;
    if(s.lc) h+=`<div class="items">${s.lc.map(([c,t])=>lcItem(c,t)).join("")}</div>`;
    if(s.top3) h+=top3HTML();
    if(s.fields) h+=s.fields.map(fieldHTML).join("");
    h+=`</div><div class="nav">${idx>0?`<button type="button" data-go="${idx-1}">Back</button>`:"<span></span>"}<span class="pos">Page ${idx+1} of ${SECTIONS.length+1}</span><button type="button" class="primary" data-go="${idx+1}">${idx===SECTIONS.length-1?"Finish and send":"Next"}</button></div></section>`;
  }
  h+=`<div class="send step" id="send" data-step="${SECTIONS.length}" hidden><h2>Send answers</h2>
  <p class="note">Press <strong>Send answers</strong> to open an email to the people ticked below with your answers already written in. Check it, then press send in your email app. If no email opens, press <strong>Save a copy</strong> and attach the file to an email or WhatsApp message to any of them. <strong>Clear the form</strong> becomes available once you have saved a copy.</p>
  <fieldset class="q" style="border:0;padding:0;margin:0"><legend class="lab" style="padding:0">Send my answers to</legend><div id="rcpts" class="rcpts"></div><p class="note" style="font-size:13.5px">Both are ticked to start with; untick either if you prefer. At least one must stay ticked. A copy is always sent to the independent assessor (Seaview Marine) for the analysis.</p></fieldset>
  <div class="btns"><button type="button" id="btnSave">Save a copy</button><button class="primary" type="button" id="btnSend">Send answers</button><button type="button" id="btnClear" disabled title="Save a copy first">Clear the form</button></div>
  <div id="sendCheck" class="callout" hidden></div>
  <div class="status" id="status" role="status"></div>
  <div id="confirmClear" hidden class="callout">Clear every answer on this device? This cannot be undone. <div class="btns" style="margin-top:8px"><button type="button" id="yesClear">Yes, clear</button><button type="button" id="noClear">Keep my answers</button></div></div>
  <details><summary class="saved">Show the answers as they will be sent</summary><pre class="out" id="preview"></pre></details>
  <div class="saved" id="savedAt"></div>
  <div class="nav" style="padding:0"><button type="button" data-go="${SECTIONS.length-1}">Back</button><span class="pos">Page ${SECTIONS.length+1} of ${SECTIONS.length+1}</span><span></span></div></div>`;
  document.getElementById("jumpWrap").innerHTML=`<div class="jump"><label for="jumpSel" class="saved">Go to page</label><select id="jumpSel">${SECTIONS.map((x,i)=>`<option value="${i}" data-t="${i+1}. ${esc(x.title)}">${i+1}. ${esc(x.title)}</option>`).join("")}<option value="${SECTIONS.length}">${SECTIONS.length+1}. Send answers</option></select></div>`;
  root.innerHTML=h;
  document.getElementById("rcpts").innerHTML=RECIPIENTS.map((r,i)=>`<label class="rcpt"><input type="checkbox" id="rc_${i}" data-rc="${i}" ${toIdx().includes(i)?"checked":""}><span><b>${esc(r.name)}</b><br><span class="addr">${esc(r.email)}</span></span></label>`).join("");
  // restore
  root.querySelectorAll("[data-k]").forEach(el=>{
    const v=S[el.dataset.k];
    if(el.type==="radio"){el.checked=v===el.value}
    else if(el.type==="checkbox"){el.checked=Array.isArray(v)&&v.includes(el.value)}
    else if(v!=null){el.value=v}
  });
  {const w=document.getElementById("vesselOtherWrap");if(w)w.hidden=S.vessel!=="Not on the list";}
  showReg();
  pageStatus();
  showStep(curStep(),false);
}

/* ---------- completion marks in the Go to page list ---------- */
const OPTIONAL=/^(ev2|ev3|I\.\d+)$/;
function pageStatus(){const j=document.getElementById("jumpSel");if(!j)return;
  root.querySelectorAll("section.step").forEach(sec=>{const i=+sec.dataset.step;const o=j.querySelector(`option[value="${i}"]`);if(!o)return;
    const units={};sec.querySelectorAll("[data-k]").forEach(el=>{const h=el.closest("[hidden]");if(h&&h!==sec)return;const k=el.dataset.k;const base=k.split("__")[0];if(OPTIONAL.test(base))return;units[base]=(units[base]||false)||filled(S[k])});
    const n=Object.keys(units).length,d=Object.values(units).filter(Boolean).length;
    o.textContent=o.dataset.t+(n===0?"":d===n?"  \u2714 done":d>0?`  (${d} of ${n})`:"")});}
document.querySelector(".bar").addEventListener("change",e=>{if(e.target.id==="jumpSel")showStep(+e.target.value)});
document.querySelector(".bar").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)showStep(+b.dataset.go)});
const STEPKEY="nisa-nephrops-form-v11-step";
function curStep(){try{const n=parseInt(localStorage.getItem(STEPKEY)||"0",10);return isNaN(n)?0:n}catch(e){return 0}}
function showStep(n,scroll){
  n=Math.max(0,Math.min(SECTIONS.length,n));
  root.querySelectorAll(".step").forEach(el=>{el.hidden=(+el.dataset.step!==n)});
  const j=document.getElementById("jumpSel"); if(j) j.value=String(n);
  try{localStorage.setItem(STEPKEY,String(n))}catch(e){}
  if(n===SECTIONS.length) refreshPreview();
  if(scroll!==false) window.scrollTo({top:0,behavior:"auto"});
}
root.addEventListener("input",onChange);root.addEventListener("change",e=>{if(e.target.id==="jumpSel"){showStep(+e.target.value);return}onChange(e)});
root.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){showStep(+b.dataset.go)}});
function onChange(e){const el=e.target;if(!el.dataset||!el.dataset.k)return;const k=el.dataset.k;
  if(k==="vessel"){const w=document.getElementById("vesselOtherWrap");if(w)w.hidden=el.value!=="Not on the list";const o=el.selectedOptions[0];const po=o&&o.dataset.po;const ps=document.querySelector('select[data-k="po"]');if(po&&ps){ps.value=po;S.po=po}
    if(o&&o.dataset.loa!==undefined){const band=(x,cuts,labs)=>{if(x===""||isNaN(+x))return"";x=+x;for(let i=0;i<cuts.length;i++)if(x<cuts[i])return labs[i];return labs[labs.length-1]};
      const fill=(k,v)=>{const sel=document.querySelector(`select[data-k="${k}"]`);if(sel&&v){sel.value=v;S[k]=v}};
      fill("loa__0",band(o.dataset.loa,[15,18,20,22,24],["Under 15 m","15 to 17.9 m","18 to 19.9 m","20 to 21.9 m","22 to 23.9 m","24 m or over"]));
      fill("loa__1",band(o.dataset.kw,[300,450,600,750],["Under 300 kW","300 to 449 kW","450 to 599 kW","600 to 749 kW","750 kW or over"]));
      fill("loa__2",o.dataset.seg);}}
  if(el.type==="radio"){S[k]=el.value}
  else if(el.type==="checkbox"){const all=[...root.querySelectorAll(`input[type=checkbox][data-k="${CSS.escape(k)}"]`)].filter(x=>x.checked).map(x=>x.value);S[k]=all}
  else S[k]=el.value;
  if(k==="vessel")showReg();
  save();}
function filled(v){return Array.isArray(v)?v.length>0:(v!=null&&String(v).trim()!=="")}
function progress(){const total=document.querySelectorAll("[data-k]").length;const keys=Object.keys(S).filter(k=>filled(S[k])).length;
  document.getElementById("count").textContent=keys+" answered";
  pageStatus();
  document.getElementById("meter").style.width=Math.min(100,Math.round(keys/Math.max(1,total*0.6)*100))+"%";}

/* ---------- build the text that is sent ---------- */
function val(k){const v=S[k];return Array.isArray(v)?v.join(", "):(v==null?"":String(v).trim())}
function buildText(){
  const L=[];const add=(a,b)=>{if(b)L.push(a+": "+b)};
  L.push("NISA NEPHROPS TRAWL CONSULTATION ("+FORM_VERSION+")");
  L.push("Sent "+new Date().toLocaleString());
  L.push("CONFIDENTIAL: for the IS&EFPO, the IFPO and Seaview Marine only.");
  L.push("Sent to: "+chosen().map(r=>r.name).join("; "));
  {const w=val("seccode__0"),n=val("seccode__1");L.push("Security code: "+((w||n)?[w,n].filter(Boolean).join(" "):"not given")+" (PO to phone the vessel on the number it holds and ask for this code)");}
  for(const s of SECTIONS){
    const before=L.length; L.push("");L.push("== "+(s.lab?"":(s.no?("SECTION "+s.no+": "):""))+s.title.toUpperCase()+" ==");const head=L.length;
    if(s.items) for(const [g,list] of s.items) for(const [c,t] of list){const b=val(c+"__basis"),sv=val(c+"__sev"),r=val(c+"__rec");if(b||sv||r)L.push(c+" "+t+" | basis "+(b||"-")+" | severity "+(sv||"-")+" | recovery "+(r||"-"))}
    if(s.lc) for(const [c,t] of s.lc){const l=val(c+"__lik"),cn=val(c+"__con");if(l||cn)L.push(c+" "+t+" | likelihood "+(l||"-")+" | concern "+(cn||"-"))}
    if(s.top3){const nm=c=>{for(const x of SECTIONS){for(const g of (x.items||[]))for(const [k,t] of g[1])if(k===c)return c+" "+t;for(const [k,t] of (x.lc||[]))if(k===c)return c+" "+t}return c};["First","Second","Third"].forEach((x,i)=>{const v=val("top3__"+i);add(x+" item",v?nm(v):"")});for(const [c,t] of IMPACTS){const r=[0,1,2].map(i=>val(c+"__"+i));if(r.some(Boolean))L.push(c+" "+t+" | "+r.map((x,i)=>["First","Second","Third"][i]+" "+(x||"-")).join(" | "))}}
    if(s.fields) for(const f of s.fields){const q=(f.n?"Q"+f.n+" ":"")+f.q;
      if(f.t==="pair"){const parts=f.parts.map((p,i)=>[typeof p==="string"?p:p.l,val(f.k+"__"+i)]).filter(x=>x[1]);if(parts.length)L.push(q+": "+parts.map(x=>x[0]+" = "+x[1]).join("; "))}
      else if(f.t==="vessel"){const v=val("vessel");add(q,v==="Not on the list"?(val("vessel__other")||v):v);const r=regInfo(S.vessel);if(r)L.push("From the fleet register: "+r.map(([a,b])=>a+" = "+b).join("; "))}
      else if(f.t==="choicetext"||f.t==="choicesel"){const a=val(f.k),d=val(f.k+"__d");if(a||d)L.push(q+": "+[a,d].filter(Boolean).join(". "))}
      else add(q,val(f.k));}
    if(L.length===head){if(s.fields||s.items||s.lc||s.top3)L.push("Not answered");else L.length=before}
  }
  L.push("");L.push("---- DATA FOR THE COLLATOR (please do not edit below this line) ----");
  const clean=x=>String(x).replace(/\[/g,"(").replace(/\]/g,")").replace(/\s*\n\s*/g," / ").trim();
  const D=["[[nisa="+FORM_VERSION+"]]","[[sent="+new Date().toISOString()+"]]","[[to="+clean(chosen().map(r=>r.email).join(", "))+"]]"];
  root.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;if(D.some(x=>x.startsWith("[["+k+"=")))return;const v=val(k);if(v)D.push("[["+k+"="+clean(v)+"]]")});
  D.push("[[end]]");L.push(D.join(" "));
  return L.join("\n");
}
/* ---------- actions ---------- */
function status(msg,err){const s=document.getElementById("status");s.textContent=msg;s.className="status"+(err?" err":"")}
function refreshPreview(){document.getElementById("preview").textContent=buildText()}
function toIdx(){const all=RECIPIENTS.map((_,j)=>j);const t=(S._to||[]).filter(i=>i<RECIPIENTS.length);return t.length?t:all}
function chosen(){return RECIPIENTS.filter((r,i)=>{const c=document.getElementById("rc_"+i);return c?c.checked:true})}
function updClear(){const b=document.getElementById("btnClear");if(b)b.disabled=!S._saved}
function wire(){
  document.getElementById("rcpts").addEventListener("change",e=>{const b=e.target.closest("[data-rc]");if(!b)return;const on=RECIPIENTS.map((_,i)=>i).filter(i=>document.getElementById("rc_"+i).checked);if(!on.length){b.checked=true;status("At least one person must stay ticked.",true);return}S._to=on;save();refreshPreview()});
  const doSend=()=>{
    document.getElementById("sendCheck").hidden=true;
    const body=buildText();refreshPreview();
    const vessel=(val("vessel")==="Not on the list"?val("vessel__other"):val("vessel").split(",")[0])||"vessel";
    const to=chosen();if(!to.length){status("Tick at least one person to send to.",true);return}
    const href="mailto:"+to.map(r=>r.email).join(",")+"?bcc="+encodeURIComponent(ASSESSOR)+"&subject="+encodeURIComponent("NISA Nephrops consultation: "+vessel)+"&body="+encodeURIComponent(body);
    try{location.href=href}catch(e){}
    status("If your email app opened, check the message and press send there. If nothing opened, press Save a copy and attach the file to an email or WhatsApp message.");
  };
  document.getElementById("btnSend").addEventListener("click",()=>{
    const pg=id=>SECTIONS.findIndex(x=>x.id===id);const miss=[];
    if(!val("vessel"))miss.push(["your vessel",pg("s1")]);
    if(!val("seccode__0")||!val("seccode__1"))miss.push(["your security code",pg("s8")]);
    if(!val("con_name"))miss.push(["your typed name",pg("s8")]);
    if(val("con_read")!=="Yes")miss.push(["confirming you have read the data protection statement",pg("s8")]);
    const empty=SECTIONS.filter((x,i)=>i>0&&(x.fields||x.items||x.lc||x.top3)&&!Object.keys(S).some(k=>filled(S[k])&&document.querySelector(`#${x.id} [data-k="${CSS.escape(k)}"]`))).length;
    if(!miss.length){doSend();return}
    const box=document.getElementById("sendCheck");
    box.innerHTML=`<strong>Before you send.</strong> Your answers can be sent as they are, even if some pages are not finished${empty?` (${empty} page${empty>1?"s have":" has"} no answers yet)`:""}. But these are needed to use them:<ul class="guide">${miss.map(([t,i])=>`<li>${t} <button type="button" class="x" data-go="${i}">Go to page ${i+1}</button></li>`).join("")}</ul><div class="btns" style="margin-top:8px"><button type="button" class="primary" id="sendAnyway">Send anyway</button></div>`;
    box.hidden=false;document.getElementById("sendAnyway").onclick=doSend;
  });
  document.getElementById("btnClear").addEventListener("click",()=>{document.getElementById("confirmClear").hidden=false});
  document.getElementById("noClear").addEventListener("click",()=>{document.getElementById("confirmClear").hidden=true});
  document.getElementById("yesClear").addEventListener("click",()=>{S={};try{localStorage.removeItem(KEY)}catch(e){}render();wire();progress();status("The form has been cleared.")});
  document.querySelector("#send details").addEventListener("toggle",refreshPreview);
  // Save a copy: Claude downloads capability when present, otherwise an ordinary browser download
  let DLc=null;(async()=>{try{DLc=window.claude&&await window.claude.use("downloads")}catch(e){DLc=null}})();
  document.getElementById("btnSave").addEventListener("click",async()=>{
    const text=buildText();refreshPreview();
    const name="NISA-consultation-"+((val("vessel")||"vessel").split(",")[0]).replace(/[^A-Za-z0-9-]+/g,"-").replace(/-+$/,"")+"-"+new Date().toISOString().slice(0,10)+".txt";
    try{
      if(DLc){await DLc.save({filename:name,data:text})}
      else{const u=URL.createObjectURL(new Blob([text],{type:"text/plain"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
      S._saved=true;save();updClear();status("A copy has been saved to this device as \u201c"+name+"\u201d.");
    }catch(e){status("The copy was not saved.",true)}
  });
  updClear();
}
render();wire();progress();
</script>
